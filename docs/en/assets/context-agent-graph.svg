<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">How Context uses Agent Graph</title>
  <desc id="desc">One thin public Agent entry routes a Context knowledge workflow through observable facts, selected resources, explicit actions and gates, evidence, and a debug feedback loop.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d5d5d5" opacity=".46"/></pattern>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#181818" flood-opacity=".075"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#ef6f2e"/></marker>
  </defs>
  <rect width="1400" height="560" fill="#f1f1f2"/>
  <rect x="20" y="20" width="1360" height="520" fill="url(#grid)"/>
  <g font-family="Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="52" y="62" fill="#181818" font-size="24" font-weight="500">Context on Agent Graph</text>
    <text x="52" y="87" fill="#717171" font-size="14">A knowledge lifecycle exposed as small, fact-grounded decisions</text>
    <g transform="translate(1194 45)"><rect width="154" height="28" rx="14" fill="#f7f7f7" stroke="#d5d5d5"/><circle cx="17" cy="14" r="4" fill="#ef6f2e"/><text x="29" y="18" fill="#535353" font-family="monospace" font-size="10" letter-spacing=".8">REAL CASE STUDY</text></g>
  </g>
  <g fill="none" stroke="#ef6f2e" stroke-width="2" marker-end="url(#arrow)">
    <path d="M278 237H300"/><path d="M516 237H538"/><path d="M754 237H776"/><path d="M992 237H1014"/>
  </g>
  <g filter="url(#lift)" font-family="Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(48 130)"><rect width="230" height="214" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><rect x="1" y="1" width="228" height="5" rx="3" fill="#ef6f2e"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">DISCOVERY</text><text x="22" y="78" fill="#181818" font-size="19" font-weight="500">One thin entry</text><text x="22" y="110" fill="#535353" font-size="13"><tspan x="22">Initialize, locate, or</tspan><tspan x="22" dy="20">continue the current goal.</tspan></text><line x1="22" y1="160" x2="208" y2="160" stroke="#e5e5e5"/><text x="22" y="187" fill="#717171" font-family="monospace" font-size="11">/c4a:context</text></g>
    <g transform="translate(300 130)"><rect width="216" height="214" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><text x="22" y="43" fill="#717171" font-family="monospace" font-size="11">HOST</text><text x="22" y="78" fill="#181818" font-size="19" font-weight="500">Context CLI</text><text x="22" y="110" fill="#535353" font-size="13"><tspan x="22">Observe sources, drafts,</tspan><tspan x="22" dy="20">approvals and artifacts.</tspan></text><line x1="22" y1="160" x2="194" y2="160" stroke="#e5e5e5"/><text x="22" y="187" fill="#717171" font-family="monospace" font-size="11">workspace facts</text></g>
    <g transform="translate(538 130)"><rect width="216" height="214" rx="14" fill="#fdfdfd" stroke="#ef6f2e" stroke-width="2"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">EVALUATION</text><text x="22" y="78" fill="#181818" font-size="19" font-weight="500">Workspace graph</text><text x="22" y="110" fill="#535353" font-size="13"><tspan x="22">Select one legal Route</tspan><tspan x="22" dy="20">from current evidence.</tspan></text><line x1="22" y1="160" x2="194" y2="160" stroke="#e5e5e5"/><text x="22" y="187" fill="#d95817" font-family="monospace" font-size="11">fact → route</text></g>
    <g transform="translate(776 130)"><rect width="216" height="214" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><text x="22" y="43" fill="#717171" font-family="monospace" font-size="11">DISCLOSURE</text><text x="22" y="78" fill="#181818" font-size="19" font-weight="500">Current context</text><text x="22" y="110" fill="#535353" font-size="13"><tspan x="22">Expose only the Action,</tspan><tspan x="22" dy="20">resources and Gate in scope.</tspan></text><line x1="22" y1="160" x2="194" y2="160" stroke="#e5e5e5"/><text x="22" y="187" fill="#717171" font-family="monospace" font-size="11">progressive loading</text></g>
    <g transform="translate(1014 130)"><rect width="338" height="214" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><rect x="1" y="1" width="336" height="5" rx="3" fill="#ef6f2e"/><text x="22" y="43" fill="#d95817" font-family="monospace" font-size="11">EXECUTION</text><text x="22" y="78" fill="#181818" font-size="19" font-weight="500">Action → evidence</text><text x="22" y="110" fill="#535353" font-size="13"><tspan x="22">Context performs the lifecycle step;</tspan><tspan x="22" dy="20">new facts drive the next evaluation.</tspan></text><line x1="22" y1="160" x2="316" y2="160" stroke="#e5e5e5"/><text x="22" y="187" fill="#717171" font-family="monospace" font-size="11">capture · extract · review · build</text></g>
  </g>
  <path d="M1183 344V405H646V360" fill="none" stroke="#ef6f2e" stroke-width="2" stroke-dasharray="6 7" marker-end="url(#arrow)"/>
  <g font-family="Inter, Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(382 427)"><rect width="636" height="76" rx="14" fill="#fdfdfd" stroke="#d5d5d5"/><circle cx="30" cy="38" r="7" fill="#ef6f2e"/><text x="52" y="32" fill="#181818" font-size="15" font-weight="500">Observable engineering feedback</text><text x="52" y="54" fill="#717171" font-size="13">Debug events replay route changes, loops and gates; tests turn failures into graph improvements.</text></g>
  </g>
</svg>
