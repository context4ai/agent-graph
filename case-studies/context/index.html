<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://context4ai.github.io/context/case-studies/workflow/">
  <title>Context workflow replay moved</title>
</head>
<body>
  <p>The Context workflow replay has moved. <a id="destination" href="https://context4ai.github.io/context/case-studies/workflow/">Open the current replay · 打开最新回放</a></p>
  <script>
    const requestedLanguage = new URLSearchParams(window.location.search).get("lang");
    const destination = new URL("https://context4ai.github.io/context/case-studies/workflow/");
    if (requestedLanguage === "en" || requestedLanguage === "zh") {
      destination.searchParams.set("lang", requestedLanguage);
    }
    document.getElementById("destination").href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
