name: Feature or protocol proposal
description: Propose a new capability or a change to the public work contract.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or host problem cannot be solved with the current contract?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Concrete use case
      description: Describe the Provider, host, facts, routes, or recovery behavior involved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the observable behavior without relying on a specific Agent implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds and why they are insufficient.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility impact
      description: Note any schema, CLI, SDK, Provider, host, or migration implications.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing Issues and Discussions.
          required: true
        - label: I have described a concrete problem rather than only a preferred implementation.
          required: true
