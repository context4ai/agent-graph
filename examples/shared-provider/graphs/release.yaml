schema: agent-graph.graph.v1
id: release
entrypoints:
  default: inspect
nodes:
  - id: inspect
    kind: action
    reasonCode: route.release.inspect
    action: actions/inspect.yaml
    resources:
      recommended: [resources/checklist.md]
  - id: approval
    kind: gate
    reasonCode: route.release.approval-required
    gate:
      id: release-approval
      prompt: Approve publishing the inspected artifact?
      authority: release.approve
      delegatable: true
  - id: publish
    kind: action
    reasonCode: route.release.publish
    action: actions/publish.yaml
  - id: done
    kind: terminal
    terminalOutcome: completed
edges:
  - from: inspect
    to: approval
    kind: requires
    outcomes: [completed]
  - from: approval
    to: publish
    kind: gatedBy
    outcomes: [completed]
  - from: publish
    to: done
    outcomes: [completed]
