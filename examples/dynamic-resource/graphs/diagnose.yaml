schema: agent-graph.graph.v1
id: diagnose
entrypoints:
  default: diagnose
nodes:
  - id: diagnose
    kind: action
    reasonCode: route.diagnose.run
    action: actions/diagnose.yaml
    resources:
      required:
        - resources/current-context.yaml
        - resources/procedure.md
  - id: done
    kind: terminal
    terminalOutcome: completed
edges:
  - from: diagnose
    to: done
    outcomes: [completed]
